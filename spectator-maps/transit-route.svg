<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Marathon spectator route from McCarren Park to First Avenue</title>
  <desc id="desc">Walk from McCarren Park to Bedford Avenue L, take the L to 14 Street Sixth Avenue, transfer to the F to Roosevelt Island, walk to the tram, ride to Manhattan, then walk to the First Avenue and 72nd Street crossing.</desc>
  <rect width="1000" height="270" rx="20" fill="#f8fafc"/>
  <text x="30" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#152238">McCarren Park → Roosevelt Island → Manhattan</text>
  <text x="30" y="68" font-family="Arial,sans-serif" font-size="14" fill="#536174">Sunday route: walk, L train, F train, tram, walk</text>

  <line x1="92" y1="135" x2="938" y2="135" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
  <line x1="92" y1="135" x2="257" y2="135" stroke="#697586" stroke-width="6" stroke-dasharray="8 7"/>
  <line x1="257" y1="135" x2="464" y2="135" stroke="#a7a9ac" stroke-width="10"/>
  <line x1="464" y1="135" x2="676" y2="135" stroke="#ff6319" stroke-width="10"/>
  <line x1="676" y1="135" x2="786" y2="135" stroke="#697586" stroke-width="6" stroke-dasharray="8 7"/>
  <line x1="786" y1="135" x2="875" y2="135" stroke="#1682bc" stroke-width="10"/>
  <line x1="875" y1="135" x2="938" y2="135" stroke="#697586" stroke-width="6" stroke-dasharray="8 7"/>

  <circle cx="92" cy="135" r="12" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="257" cy="135" r="17" fill="#a7a9ac"/>
  <circle cx="464" cy="135" r="17" fill="#ff6319"/>
  <circle cx="676" cy="135" r="17" fill="#ff6319"/>
  <circle cx="786" cy="135" r="12" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="875" cy="135" r="12" fill="#fff" stroke="#1682bc" stroke-width="4"/>
  <circle cx="938" cy="135" r="12" fill="#fff" stroke="#334155" stroke-width="4"/>
  <text x="257" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">L</text>
  <text x="464" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">F</text>
  <text x="676" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">F</text>

  <g font-family="Arial,sans-serif" font-size="14" fill="#152238" text-anchor="middle">
    <text x="92" y="181">Bedford &amp; N 12th</text>
    <text x="257" y="181">Bedford Av</text>
    <text x="464" y="181">14 St–6 Av</text>
    <text x="676" y="181">Roosevelt Island</text>
    <text x="786" y="181">Island tram</text>
    <text x="875" y="181">Manhattan</text>
    <text x="938" y="200">1st &amp;</text>
    <text x="938" y="218">72nd</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="12" fill="#536174" text-anchor="middle">
    <text x="174" y="113">walk ~8 min</text>
    <text x="361" y="113">L toward 8 Av</text>
    <text x="570" y="113">F toward Queens</text>
    <text x="730" y="113">walk ~3 min</text>
    <text x="834" y="113">tram</text>
    <text x="933" y="113">walk</text>
  </g>
  <text x="30" y="248" font-family="Arial,sans-serif" font-size="12" fill="#536174">Diagram is for orientation; check MTA and tram service on race day. Tram runs beside the Queensboro Bridge.</text>
</svg>
