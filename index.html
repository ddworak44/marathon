<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Marathon</title>

<!-- Home-screen / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marathon">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="icon.svg">

<style>
  :root{
    --bg:#0b0b0f; --card:#16161d; --card2:#1e1e28; --line:#2a2a36;
    --txt:#f4f4f6; --dim:#9a9aab; --dim2:#6a6a78;
    --accent:#4ade80;
    --easy:#60a5fa; --pace:#f59e0b; --tempo:#f472b6;
    --speed:#a78bfa; --long:#fb7185; --rest:#6a6a78; --race:#4ade80;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 40px);
    max-width:560px;margin:0 auto;min-height:100vh}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}
  .hidden{display:none!important}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .top .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .countdown{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:5px 0 0 18px}
  .countdown b{color:var(--accent);font-weight:800;font-size:14px}
  .iconbtn{width:38px;height:38px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:17px;color:var(--dim)}
  .iconbtn:active{background:var(--card2)}

  /* today card */
  .today{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:22px;padding:20px;position:relative;overflow:hidden}
  .today .accentbar{position:absolute;left:0;top:0;bottom:0;width:5px}
  .today .meta{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .today .date{font-size:12.5px;color:var(--dim2);margin-top:2px}
  .today .workout{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:14px 0 4px}
  .today .sub{font-size:14px;color:var(--dim);line-height:1.4}
  .today .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    text-transform:uppercase;letter-spacing:.06em;margin-top:12px}

  .actual{margin-top:14px;background:#0f0f15;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .actual .row{display:flex;gap:16px;align-items:baseline}
  .actual .big{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .actual .u{font-size:12px;color:var(--dim);font-weight:600;margin-left:3px}
  .actual .note{font-size:13px;color:var(--dim);margin-top:7px;line-height:1.4;font-style:italic}

  .doneBtn{margin-top:16px;width:100%;padding:15px;border-radius:15px;font-size:16px;font-weight:700;
    background:#242432;color:var(--txt);display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .08s ease,background .15s ease}
  .doneBtn:active{transform:scale(.985)}
  .doneBtn.done{background:var(--accent);color:#06210f}
  .doneBtn .chk{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:13px}
  .doneBtn.done .chk{background:#06210f;color:var(--accent);border-color:#06210f}
  .logBtn{margin-top:9px;width:100%;padding:12px;border-radius:13px;font-size:14px;font-weight:600;
    background:transparent;border:1px solid var(--line);color:var(--dim)}
  .logBtn:active{background:var(--card)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 12px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}

  .prog{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
  .prog .head{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:9px}
  .prog .head b{color:var(--txt)}
  .bar{height:9px;border-radius:99px;background:#2a2a36;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .4s ease}

  .sec{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 12px}
  .sec h2{font-size:16px}
  .sec .hint{font-size:12px;color:var(--dim2)}

  .week{margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:opacity .2s}
  .week.past{opacity:.5}
  .week.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .week>.wh{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;gap:8px}
  .week>.wh:active{background:var(--card2)}
  .week .wh .wl{font-size:14px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap}
  .week .wh .wl small{color:var(--dim2);font-weight:500;margin-left:7px;font-size:12px}
  .week .wh .wl small .lg{color:var(--accent);font-weight:700}
  .badge{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase;margin-left:8px}
  .badge.now{background:var(--accent);color:#06210f}
  .badge.next{background:#2a2a36;color:var(--dim)}
  .badge.last{background:#2a2a36;color:var(--dim2)}
  .week .wh .wr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);flex:none}
  .minibar{width:46px;height:6px;border-radius:99px;background:#2a2a36;overflow:hidden}
  .minibar>i{display:block;height:100%;background:var(--accent)}
  .days{border-top:1px solid var(--line)}
  .day{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid #23232e}
  .day:first-child{border-top:none}
  .day:active{background:var(--card2)}
  .day.today{background:rgba(74,222,128,.06)}
  .day .dname{width:34px;font-size:11px;font-weight:700;color:var(--dim2);text-transform:uppercase;flex:none}
  .day.today .dname{color:var(--accent)}
  .day .dw{flex:1;font-size:14px;min-width:0}
  .day .dw .dt{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:middle}
  .day .dw .act{display:block;font-size:11.5px;color:var(--accent);margin:3px 0 0 16px;font-weight:600}
  .day .dw .act .nn{color:var(--dim);font-weight:400;font-style:italic}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
    font-size:14px;color:transparent;flex:none;transition:.12s}
  .check.on{background:var(--accent);border-color:var(--accent);color:#06210f}
  .check.rest{border-style:dashed;opacity:.5}

  /* sheets */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    display:grid;place-items:center;padding:20px;z-index:50}
  .sheet .box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
  .sheet h3{font-size:20px;margin-bottom:6px}
  .sheet p{color:var(--dim);font-size:14px;line-height:1.5;margin:0 0 18px}
  .sheet label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
  .sheet input,.sheet textarea{width:100%;padding:13px;border-radius:13px;background:#0f0f15;border:1px solid var(--line);
    color:var(--txt);font-size:16px}
  .sheet textarea{resize:vertical;min-height:64px;line-height:1.4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 label{margin-top:0}
  .paceview{margin-top:12px;font-size:14px;color:var(--dim);text-align:center}
  .paceview b{color:var(--accent);font-size:18px}
  .paceview .proj{margin-top:9px;font-size:13px;color:var(--dim)}
  .paceview .proj b{color:var(--accent);font-size:16px}
  .paceview .pred{display:block;margin-top:2px;color:var(--dim2);font-size:12px}
  .actual .proj{font-size:13px;color:var(--dim);margin-top:10px;padding-top:9px;border-top:1px solid var(--line);line-height:1.5}
  .actual .proj b{color:var(--accent)}
  .actual .proj .pred{display:block;margin-top:2px;color:var(--dim2);font-size:12px}
  .donerow{display:flex;align-items:center;gap:12px;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0f0f15}
  .donerow .sw{width:46px;height:28px;border-radius:99px;background:#2a2a36;position:relative;flex:none;transition:.15s}
  .donerow .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
  .donerow.on .sw{background:var(--accent)}
  .donerow.on .sw::after{left:21px}
  .donerow span{font-size:15px;font-weight:600}
  .sheet .primary{margin-top:20px;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#06210f;font-weight:800;font-size:16px}
  .sheet .ghost{margin-top:10px;width:100%;padding:12px;border-radius:14px;background:transparent;color:var(--dim);font-size:14px}
  .sheet .danger{color:#f87171}
  .info{background:#0f0f15;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--dim);line-height:1.5}

  /* strength */
  .strBtn{margin-top:9px;width:100%;padding:12px;border-radius:13px;font-size:14px;font-weight:600;
    background:transparent;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px}
  .strBtn:active{background:var(--card)}
  .strBtn.done{border-color:var(--accent);color:var(--accent)}
  .day .strbtn{font-size:13px;color:var(--dim2);flex:none;display:flex;align-items:center;gap:3px;padding:3px 5px;border-radius:8px}
  .day .strbtn.on{color:var(--accent)}
  .day .strbtn b{font-size:11px;font-weight:800}
  .exhead{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;font-size:10px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--dim2);padding:2px 0 4px}
  .exhead span{text-align:center}.exhead span:first-child{text-align:left}
  .exrow{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .exleft{display:flex;align-items:center;gap:10px;min-width:0}
  .exleft>div{min-width:0}
  .excheck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);color:transparent;font-size:12px;
    flex:none;display:grid;place-items:center;transition:.12s}
  .excheck.on{background:var(--accent);border-color:var(--accent);color:#06210f}
  .exn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .exp{font-size:11px;color:var(--dim2)}
  .stepper{display:flex;align-items:center;justify-content:space-between;background:#0f0f15;border:1px solid var(--line);border-radius:10px;padding:2px}
  .stepper button{width:22px;height:26px;border-radius:7px;font-size:18px;font-weight:700;color:var(--dim)}
  .stepper button:active{background:var(--card2)}
  .stepper span{font-size:15px;font-weight:700;min-width:20px;text-align:center}

  .footnote{text-align:center;color:var(--dim2);font-size:11.5px;margin-top:28px;line-height:1.5}
</style>
</head>
<body>

<div class="top">
  <div>
    <div class="brand"><span class="dot"></span>Marathon · Advanced 2</div>
    <div class="countdown" id="countdown"></div>
  </div>
  <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button>
</div>

<div id="app"></div>

<div class="footnote">
  Hal Higdon Advanced 2 · Weeks 4–18<br>
  Progress saved on this device · works offline
</div>

<!-- Log editor sheet -->
<div class="sheet hidden" id="logSheet">
  <div class="box">
    <h3 id="logTitle">Log run</h3>
    <p id="logDesc"></p>
    <div class="donerow" id="doneToggle"><div class="sw"></div><span>Completed</span></div>
    <div class="grid2" style="margin-top:16px">
      <div><label>Distance (mi)</label><input type="text" inputmode="numeric" id="inDist" placeholder="0.00"></div>
      <div><label>Time (h:mm:ss)</label><input type="text" inputmode="numeric" id="inTime" placeholder="0:00"></div>
    </div>
    <div class="paceview" id="paceView"></div>
    <label>Note</label>
    <textarea id="inNote" placeholder="How did it feel?"></textarea>
    <button class="primary" id="logSave">Save</button>
    <button class="ghost danger" id="logClear">Clear this entry</button>
    <button class="ghost" id="logCancel">Cancel</button>
  </div>
</div>

<!-- Strength sheet -->
<div class="sheet hidden" id="strSheet">
  <div class="box">
    <h3 id="strTitle">Strength</h3>
    <p id="strDesc"></p>
    <div id="strRows"></div>
    <button class="primary" id="strSave">Save</button>
    <button class="ghost" id="strCancel">Cancel</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet hidden" id="sheet">
  <div class="box">
    <h3 id="sheetTitle">Race date</h3>
    <p>The 18-week plan counts backward from your marathon (a Sunday).</p>
    <label>Race day</label>
    <input type="date" id="raceInput">
    <div class="info" id="dateInfo" style="margin-top:14px"></div>
    <button class="primary" id="saveBtn">Save plan</button>
    <button class="ghost" id="closeBtn">Cancel</button>
    <button class="ghost danger" id="resetBtn">Reset all logged progress</button>
  </div>
</div>

<script>
/* ---------- data: Hal Higdon Advanced 2, [Mon..Sun] ---------- */
const GRID = [
  ["3 mi run","3 x hill","3 mi run","30 min tempo","Rest","5 mi pace","10 mi long run"],
  ["3 mi run","30 min tempo","3 mi run","3 mi pace","Rest","5 mi run","11 mi long run"],
  ["3 mi run","4 x 800","3 mi run","30 min tempo","Rest","6 mi pace","8 mi long run"],
  ["3 mi run","4 x hill","3 mi run","35 min tempo","Rest","6 mi pace","13 mi long run"],
  ["3 mi run","35 min tempo","3 mi run","3 mi pace","Rest","7 mi run","14 mi long run"],
  ["3 mi run","5 x 800","3 mi run","35 min tempo","Rest","7 mi pace","10 mi long run"],
  ["3 mi run","5 x hill","4 mi run","40 min tempo","Rest","8 mi pace","16 mi long run"],
  ["3 mi run","40 min tempo","4 mi run","3 mi pace","Rest","8 mi run","17 mi long run"],
  ["4 mi run","6 x 800","4 mi run","40 min tempo","Rest","Rest","Half Marathon"],
  ["3 mi run","6 x hill","4 mi run","45 min tempo","Rest","9 mi pace","19 mi long run"],
  ["4 mi run","45 min tempo","5 mi run","4 mi pace","Rest","10 mi run","20 mi long run"],
  ["4 mi run","7 x 800","5 mi run","45 min tempo","Rest","6 mi pace","12 mi long run"],
  ["4 mi run","7 x hill","5 mi run","50 min tempo","Rest","10 mi pace","20 mi long run"],
  ["5 mi run","45 min tempo","5 mi run","5 mi pace","Rest","6 mi run","12 mi long run"],
  ["5 mi run","8 x 800","5 mi run","40 min tempo","Rest","10 mi pace","20 mi long run"],
  ["5 mi run","6 x hill","5 mi run","30 min tempo","Rest","4 mi pace","12 mi long run"],
  ["4 mi run","30 min tempo","4 mi run","4 mi pace","Rest","4 mi run","8 mi long run"],
  ["3 mi run","4 x 400","3 mi run","Rest","Rest","2 mi run","Marathon"],
];
const DNAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const TOTAL_DAYS = 18*7;
const START_WEEK = 3; // 0-based: skip weeks 1–3, plan shown/counted from Week 4 on

/* seed: runs already completed (Week 4 = index 3) — key "w-d", w & d 0-based */
const SEED = {
  "3-1":{done:true,dist:4.61,timeSec:null,note:"pace unknown"},   // Tue Jul 21
  "3-2":{done:true,dist:3.89,timeSec:2104,note:""},               // Wed Jul 22  ~9:01/mi
  "3-3":{done:true,dist:4.45,timeSec:2425,note:""},               // Thu Jul 23  ~9:05/mi
};

/* suggested strength pairing per weekday (0=Mon..6=Sun) — legs bend to the run.
   reps default to multiples of 5 (stepper: sets ±1, reps ±5). Adjust to what you actually did. */
const STRENGTH = {
  0:[ // Mon · easy run — full body, light
    {n:"Pull-ups",p:"Vertical pull",sets:3,reps:5},
    {n:"Push-ups",p:"Horizontal push",sets:3,reps:15},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Squats",p:"Squat",sets:3,reps:15},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:10},
    {n:"Calf raises",p:"Calves",sets:3,reps:20},
  ],
  1:[ // Tue · intervals/hills — full body incl. legs (already warm)
    {n:"Pull-ups",p:"Vertical pull",sets:4,reps:5},
    {n:"Dips",p:"Vertical push",sets:3,reps:10},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Split squats",p:"Squat · per leg",sets:3,reps:10},
    {n:"Single-leg deadlifts",p:"Hinge · per leg",sets:3,reps:10},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:10},
    {n:"Calf raises",p:"Calves",sets:3,reps:20},
  ],
  2:[ // Wed · easy run — upper + core
    {n:"Pull-ups",p:"Vertical pull",sets:3,reps:5},
    {n:"Push-ups",p:"Horizontal push",sets:3,reps:15},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Pike push-ups",p:"Vertical push",sets:3,reps:10},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:10},
    {n:"Calf raises",p:"Calves",sets:3,reps:20},
  ],
  3:[ // Thu · tempo/pace — upper + core (spare the legs)
    {n:"Chin-ups",p:"Vertical pull",sets:3,reps:5},
    {n:"Dips",p:"Vertical push",sets:3,reps:10},
    {n:"Push-ups",p:"Horizontal push",sets:3,reps:15},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:10},
    {n:"Calf raises",p:"Calves",sets:3,reps:20},
  ],
  4:[ // Fri · rest from running — full body
    {n:"Pull-ups",p:"Vertical pull",sets:4,reps:5},
    {n:"Push-ups",p:"Horizontal push",sets:3,reps:20},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Squats",p:"Squat",sets:3,reps:20},
    {n:"Lunges",p:"Squat · per leg",sets:3,reps:10},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:15},
  ],
  5:[ // Sat · pace run (day before long) — upper only, legs off
    {n:"Pull-ups",p:"Vertical pull",sets:3,reps:5},
    {n:"Push-ups",p:"Horizontal push",sets:3,reps:15},
    {n:"Inverted rows",p:"Horizontal pull",sets:3,reps:10},
    {n:"Pike push-ups",p:"Vertical push",sets:3,reps:10},
    {n:"Hanging leg raises",p:"Core",sets:3,reps:10},
  ],
  6:[], // Sun · long run — rest (the long run is the work)
};
const STRNOTE = {
  0:"Easy run day — light full body.",
  1:"Legs are already lit from intervals, so stack the lower-body work here.",
  2:"Upper body + core — keep the legs fresh for tomorrow's tempo.",
  3:"Tempo day — upper + core only, spare the legs.",
  4:"Rest from running — a good day for a fuller session.",
  5:"Day before the long run — upper body only, no legs.",
  6:"Long-run day — the run is plenty. No strength.",
};

function classify(w){
  const s=w.toLowerCase();
  if(s.includes("half marathon")) return {t:"race",c:"var(--race)",label:"Tune-up race",desc:"Race a half marathon — great fitness test, run it hard."};
  if(s==="marathon") return {t:"race",c:"var(--race)",label:"RACE DAY",desc:"This is it. 26.2 miles. Trust the training."};
  if(s.includes("rest")) return {t:"rest",c:"var(--rest)",label:"Rest",desc:"Full recovery. No running today — let the work sink in."};
  if(s.includes("pace")) return {t:"pace",c:"var(--pace)",label:"Marathon pace",desc:"Run at your goal marathon pace — smooth and controlled."};
  if(s.includes("tempo")) return {t:"tempo",c:"var(--tempo)",label:"Tempo",desc:"Sustained hard effort — comfortably uncomfortable."};
  if(s.includes("hill")) return {t:"speed",c:"var(--speed)",label:"Hill repeats",desc:"Hard uphill reps, jog down to recover. Builds strength + power."};
  if(s.includes("x 800")||s.includes("x 400")) return {t:"speed",c:"var(--speed)",label:"Track intervals",desc:"Fast repeats with jog recovery. Push the pace."};
  if(s.includes("long run")) return {t:"long",c:"var(--long)",label:"Long run",desc:"Easy, conversational pace. The cornerstone of the week."};
  return {t:"easy",c:"var(--easy)",label:"Easy run",desc:"Relaxed, easy effort. Recovery miles."};
}

/* ---------- storage ---------- */
const LS_RACE="marathon_raceDate", LS_LOG="marathon_log", LS_SEED="marathon_seed_v1", LS_DONE="marathon_done";
const DEFAULT_RACE="2026-11-01";
function getRace(){return parseDate(localStorage.getItem(LS_RACE)||DEFAULT_RACE);}
function getLog(){
  try{return JSON.parse(localStorage.getItem(LS_LOG)||"{}");}catch(e){return{};}
}
function setLog(l){localStorage.setItem(LS_LOG,JSON.stringify(l));}
function key(w,d){return w+"-"+d;}

/* one-time migration + seed */
(function init(){
  let log=getLog();
  // migrate legacy done map
  const legacy=localStorage.getItem(LS_DONE);
  if(legacy){try{const m=JSON.parse(legacy);for(const k in m)if(m[k]&&!log[k])log[k]={done:true};}catch(e){}localStorage.removeItem(LS_DONE);}
  // seed pre-completed runs, once, without clobbering existing entries
  if(!localStorage.getItem(LS_SEED)){
    for(const k in SEED) if(!log[k]) log[k]={...SEED[k]};
    localStorage.setItem(LS_SEED,"1");
  }
  setLog(log);
})();

/* ---------- date + format helpers ---------- */
function parseDate(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d);}
function toISO(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function midnight(dt){return new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+n);return x;}
function startFromRace(race){return addDays(race,-(TOTAL_DAYS-1));}
function dayNumber(start,date){return Math.round((midnight(date)-midnight(start))/86400000);}
function fmtDate(dt){return dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}
function fmtShort(dt){return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
/* smart entry: digits only, read right-to-left. last 2 = seconds, next 2 = minutes, rest = hours.
   "809" -> 8:09,  "3504" -> 35:04,  "80925" -> 8:09:25 */
function secFromDigits(v){const d=(""+v).replace(/\D/g,"").slice(0,6);if(!d)return null;
  const s=+d.slice(-2),m=+(d.length>2?d.slice(-4,-2):0),h=+(d.length>4?d.slice(0,-4):0);
  return h*3600+m*60+s;}
function maskTime(v){let d=(""+v).replace(/\D/g,"").slice(0,6);if(!d)return"";
  const p=[];while(d.length>2){p.unshift(d.slice(-2));d=d.slice(0,-2);}p.unshift(d);return p.join(":");}
/* mileage: digits only, last 2 are always the decimals. "461" -> 4.61,  "5" -> 0.05 */
function maskDist(v){const d=(""+v).replace(/\D/g,"");if(!d)return"";return (parseInt(d,10)/100).toFixed(2);}
function fmtTime(sec){if(sec==null)return"";sec=Math.round(sec);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
function fmtPace(timeSec,dist){if(!timeSec||!dist)return"";const p=timeSec/dist,m=Math.floor(p/60),s=Math.round(p%60);
  return `${m}:${String(s).padStart(2,"0")}`;}
function fmtMi(x){return (+x.toFixed(1)).toString();}
const MARATHON_MI=26.2188;
/* project a run to a full marathon: linear = same pace held; riegel = fatigue-adjusted race equivalent */
function projMarathon(timeSec,dist){if(!timeSec||!dist)return null;
  return {linear:timeSec/dist*MARATHON_MI, riegel:timeSec*Math.pow(MARATHON_MI/dist,1.06)};}
/* planned miles for a workout label (tempo/interval days have no listed distance → 0) */
function plannedMiles(label){const s=label.toLowerCase();
  const m=s.match(/(\d+(?:\.\d+)?)\s*mi\b/);if(m)return parseFloat(m[1]);
  if(s.includes("half marathon"))return 13.1;if(s==="marathon")return 26.2;return 0;}

/* ---------- render ---------- */
const app=document.getElementById("app");
let CUR_N=-999, START=null;

function render(){
  const race=getRace(), start=startFromRace(race), today=midnight(new Date());
  const n=dayNumber(start,today), log=getLog();
  CUR_N=n; START=start;

  // countdown to race day
  const daysToRace=dayNumber(today,race), cd=document.getElementById("countdown");
  if(daysToRace>0)cd.innerHTML=`Days until race · <b>${daysToRace}</b>`;
  else if(daysToRace===0)cd.innerHTML=`<b>Race day 🎉</b>`;
  else cd.innerHTML=`Race day passed`;

  // totals
  let totalWk=0,doneWk=0,totalMi=0;
  for(let w=START_WEEK;w<18;w++)for(let d=0;d<7;d++){
    const c=classify(GRID[w][d]),e=log[key(w,d)];
    if(e&&e.dist)totalMi+=Number(e.dist);
    if(c.t==="rest")continue;totalWk++;if(e&&e.done)doneWk++;
  }
  const pct=totalWk?Math.round(doneWk/totalWk*100):0;

  // streak
  let streak=0;
  for(let i=Math.min(n,TOTAL_DAYS-1);i>=START_WEEK*7;i--){
    if(i>n)continue;const w=Math.floor(i/7),d=i%7,c=classify(GRID[w][d]);
    if(c.t==="rest")continue;const e=log[key(w,d)];
    if(e&&e.done)streak++;else break;
  }

  let html="";

  // today card
  if(n<0){
    const days=-n;
    html+=`<div class="today"><div class="accentbar" style="background:var(--rest)"></div>
      <div class="meta">Countdown</div><div class="date">Plan starts ${fmtDate(start)}</div>
      <div class="workout">${days} day${days>1?"s":""} to go</div>
      <div class="sub">Week ${START_WEEK+1} begins soon. First workout: <b>${GRID[START_WEEK][0]}</b>.</div></div>`;
  } else if(n>=TOTAL_DAYS){
    html+=`<div class="today"><div class="accentbar" style="background:var(--race)"></div>
      <div class="meta">Complete</div><div class="workout">Plan finished 🎉</div>
      <div class="sub">${doneWk}/${totalWk} workouts · ${totalMi.toFixed(1)} mi logged. Hope the race went well!</div></div>`;
  } else {
    const w=Math.floor(n/7),d=n%7,label=GRID[w][d],c=classify(label),e=log[key(w,d)]||{};
    const isRest=c.t==="rest",isDone=!!e.done;
    html+=`<div class="today"><div class="accentbar" style="background:${c.c}"></div>
      <div class="meta">Week ${w+1} · ${DNAMES[d]}</div><div class="date">${fmtDate(today)}</div>
      <div class="workout">${label}</div><div class="sub">${c.desc}</div>
      <div class="tag" style="background:${c.c}22;color:${c.c}">${c.label}</div>`;
    if(e.dist||e.timeSec||e.note) html+=actualBlock(e);
    if(isRest){
      html+=`<div class="doneBtn ${isDone?'done':''}" style="cursor:default;opacity:.85"><span class="chk">✓</span> Rest day</div>
        <button class="logBtn" data-log="${w}-${d}">＋ Log cross-training / note</button>`;
    } else {
      html+=`<button class="doneBtn ${isDone?'done':''}" data-toggle="${w}-${d}"><span class="chk">✓</span> ${isDone?"Done — nice work":"Mark today complete"}</button>
        <button class="logBtn" data-log="${w}-${d}">${(e.dist||e.timeSec)?"✎ Edit run details":"＋ Log run details"}</button>`;
    }
    if((STRENGTH[d]||[]).length){
      const sc=strCount(e,d),allDone=sc.total&&sc.done===sc.total;
      html+=`<button class="strBtn ${allDone?'done':''}" data-str="${w}-${d}">💪 Strength${sc.done?` · ${sc.done}/${sc.total}${allDone?' ✓':''}`:` · ${sc.total} exercises`}</button>`;
    } else {
      html+=`<div class="sub" style="margin-top:12px;font-size:12.5px">💪 ${STRNOTE[d]}</div>`;
    }
    html+=`</div>`;
  }

  // stats
  const weekNow=(n>=0&&n<TOTAL_DAYS)?Math.floor(n/7)+1:(n<0?0:18);
  html+=`<div class="stats">
    <div class="stat"><div class="n">${weekNow||"–"}</div><div class="l">Week</div></div>
    <div class="stat"><div class="n">${streak}</div><div class="l">Day streak</div></div>
    <div class="stat"><div class="n">${totalMi.toFixed(0)}</div><div class="l">Miles logged</div></div>
  </div>`;

  html+=`<div class="prog"><div class="head"><span>Overall progress</span><span><b>${pct}%</b> · ${doneWk}/${totalWk}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;

  // schedule
  html+=`<div class="sec"><h2>Full schedule</h2><span class="hint">tap a day to log · 💪 for strength</span></div>`;
  const curW=(n>=0&&n<TOTAL_DAYS)?Math.floor(n/7):(n<0?-1:18);
  for(let w=START_WEEK;w<18;w++){
    let wt=0,wd=0,plannedMi=0,loggedMi=0;
    for(let d=0;d<7;d++){
      const c=classify(GRID[w][d]),e=log[key(w,d)]||{};
      plannedMi+=plannedMiles(GRID[w][d]);
      if(e.dist)loggedMi+=Number(e.dist);
      if(c.t==="rest")continue;wt++;if(e.done)wd++;
    }
    const wpct=wt?Math.round(wd/wt*100):0;
    const mileLabel=loggedMi>0?`<span class="lg">${fmtMi(loggedMi)}</span>/${fmtMi(plannedMi)} mi`:`${fmtMi(plannedMi)} mi`;
    const isNow=w===curW, isPast=w<curW, open=isNow;
    let badge="";
    if(w===curW)badge=`<span class="badge now">This week</span>`;
    else if(w===curW-1)badge=`<span class="badge last">Last week</span>`;
    else if(w===curW+1)badge=`<span class="badge next">Next week</span>`;
    html+=`<div class="week ${isNow?'now':''} ${isPast?'past':''}" data-week="${w}">
      <div class="wh" data-toggleweek="${w}">
        <div class="wl">Week ${w+1}${badge}<small>${fmtShort(addDays(start,w*7))}–${fmtShort(addDays(start,w*7+6))} · ${mileLabel}</small></div>
        <div class="wr"><span>${wd}/${wt}</span><span class="minibar"><i style="width:${wpct}%"></i></span><span>${open?'▾':'▸'}</span></div>
      </div><div class="days ${open?'':'hidden'}">`;
    for(let d=0;d<7;d++){
      const label=GRID[w][d],c=classify(label),dayN=w*7+d,isToday=dayN===n,e=log[key(w,d)]||{};
      const isDone=!!e.done,isRest=c.t==="rest";
      let act="";
      if(e.dist||e.timeSec){
        const bits=[];
        if(e.dist)bits.push(Number(e.dist).toFixed(2)+" mi");
        if(e.timeSec)bits.push(fmtTime(e.timeSec));
        if(e.timeSec&&e.dist)bits.push(fmtPace(e.timeSec,e.dist)+" /mi");
        act=`<span class="act">${bits.join(" · ")}${e.note?` <span class="nn">— ${escapeHtml(e.note)}</span>`:""}</span>`;
      } else if(e.note){ act=`<span class="act"><span class="nn">${escapeHtml(e.note)}</span></span>`; }
      const sc=strCount(e,d);
      const strTag=sc.total?`<button class="strbtn ${sc.done===sc.total?'on':''}" data-str="${w}-${d}">💪${sc.done?`<b>${sc.done}/${sc.total}</b>`:""}</button>`:"";
      html+=`<div class="day ${isToday?'today':''}" data-log="${w}-${d}">
        <span class="dname">${DNAMES[d]}</span>
        <span class="dw"><span class="dt" style="background:${c.c}"></span>${label}${act}</span>
        ${strTag}
        <span class="check ${isRest?'rest':''} ${isDone?'on':''}" data-toggle="${w}-${d}">✓</span></div>`;
    }
    html+=`</div></div>`;
  }
  app.innerHTML=html;
  wire();
}

function actualBlock(e){
  const pace=(e.timeSec&&e.dist)?fmtPace(e.timeSec,e.dist):null;
  let cells="";
  if(e.dist)cells+=`<div><span class="big">${Number(e.dist).toFixed(2)}</span><span class="u">mi</span></div>`;
  if(e.timeSec)cells+=`<div><span class="big">${fmtTime(e.timeSec)}</span><span class="u">time</span></div>`;
  if(pace)cells+=`<div><span class="big">${pace}</span><span class="u">/mi</span></div>`;
  const pj=projMarathon(e.timeSec,e.dist);
  const proj=pj?`<div class="proj">At this pace → <b>${fmtTime(pj.linear)}</b> marathon<span class="pred">≈ ${fmtTime(pj.riegel)} realistic (fatigue-adjusted)</span></div>`:"";
  return `<div class="actual">${cells?`<div class="row">${cells}</div>`:""}${proj}${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:""}</div>`;
}
function escapeHtml(s){return (""+s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

/* strength: merge a day's saved entries onto the suggested defaults */
function strList(entry,day){
  const saved=(entry&&entry.str)||{};
  return (STRENGTH[day]||[]).map(x=>{const s=saved[x.n]||{};
    return {n:x.n,p:x.p,sets:s.sets??x.sets,reps:s.reps??x.reps,done:!!s.done};});
}
function strCount(entry,day){const l=strList(entry,day);return {done:l.filter(a=>a.done).length,total:l.length};}

function wire(){
  app.querySelectorAll("[data-toggleweek]").forEach(el=>el.addEventListener("click",e=>{
    const wk=el.getAttribute("data-toggleweek");
    const box=app.querySelector(`.week[data-week="${wk}"] .days`);
    box.classList.toggle("hidden");
    el.querySelector(".wr span:last-child").textContent=box.classList.contains("hidden")?"▸":"▾";
  }));
  app.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    const[w,d]=el.getAttribute("data-toggle").split("-");
    const log=getLog(),k=key(w,d),en=log[k]||{};en.done=!en.done;
    if(!en.done&&!en.dist&&!en.timeSec&&!en.note)delete log[k];else log[k]=en;
    setLog(log);render();
  }));
  app.querySelectorAll("[data-str]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    const[w,d]=el.getAttribute("data-str").split("-");openStr(+w,+d);
  }));
  app.querySelectorAll("[data-log]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.closest("[data-toggle]")||e.target.closest("[data-str]"))return;
    const[w,d]=el.getAttribute("data-log").split("-");openLog(+w,+d);
  }));
}

/* ---------- log editor ---------- */
const logSheet=document.getElementById("logSheet");
const inDist=document.getElementById("inDist"),inTime=document.getElementById("inTime"),
      inNote=document.getElementById("inNote"),paceView=document.getElementById("paceView"),
      doneToggle=document.getElementById("doneToggle");
let editKey=null;

function updatePaceView(){
  const dist=parseFloat(inDist.value),sec=secFromDigits(inTime.value);
  if(!(dist&&sec)){paceView.innerHTML="";return;}
  const pj=projMarathon(sec,dist);
  paceView.innerHTML=`Pace <b>${fmtPace(sec,dist)}</b> /mi`+
    `<div class="proj">Hold this pace → <b>${fmtTime(pj.linear)}</b> marathon`+
    `<span class="pred">≈ ${fmtTime(pj.riegel)} realistic (fatigue-adjusted)</span></div>`;
}
inDist.addEventListener("input",()=>{inDist.value=maskDist(inDist.value);updatePaceView();});
inTime.addEventListener("input",()=>{inTime.value=maskTime(inTime.value);updatePaceView();});
doneToggle.addEventListener("click",()=>doneToggle.classList.toggle("on"));

function openLog(w,d){
  editKey=key(w,d);
  const label=GRID[w][d],e=getLog()[editKey]||{};
  document.getElementById("logTitle").textContent=`Week ${w+1} · ${DNAMES[d]}`;
  document.getElementById("logDesc").textContent="Planned: "+label;
  inDist.value=e.dist||"";
  inTime.value=e.timeSec?fmtTime(e.timeSec):"";
  inNote.value=e.note||"";
  doneToggle.classList.toggle("on",!!e.done);
  updatePaceView();
  logSheet.classList.remove("hidden");
}
document.getElementById("logSave").addEventListener("click",()=>{
  const log=getLog(),dist=parseFloat(inDist.value),sec=secFromDigits(inTime.value),note=inNote.value.trim();
  const en={done:doneToggle.classList.contains("on")};
  if(!isNaN(dist)&&dist>0)en.dist=Math.round(dist*100)/100;
  if(sec)en.timeSec=sec;
  if(note)en.note=note;
  if(!en.done&&!en.dist&&!en.timeSec&&!en.note)delete log[editKey];else log[editKey]=en;
  setLog(log);logSheet.classList.add("hidden");render();
});
document.getElementById("logClear").addEventListener("click",()=>{
  const log=getLog();delete log[editKey];setLog(log);logSheet.classList.add("hidden");render();
});
document.getElementById("logCancel").addEventListener("click",()=>logSheet.classList.add("hidden"));

/* ---------- strength editor ---------- */
const strSheet=document.getElementById("strSheet"),strRows=document.getElementById("strRows");
let strW=null,strD=null;

function stepper(field,val){
  const st=field==="sets"?1:5;
  return `<div class="stepper" data-f="${field}"><button type="button" data-s="${-st}">−</button><span>${val}</span><button type="button" data-s="${st}">＋</button></div>`;
}
function openStr(w,d){
  if(!(STRENGTH[d]||[]).length)return;
  strW=w;strD=d;
  const list=strList(getLog()[key(w,d)],d);
  document.getElementById("strTitle").textContent=`Strength · Week ${w+1} · ${DNAMES[d]}`;
  document.getElementById("strDesc").textContent=STRNOTE[d]||"";
  strRows.innerHTML=`<div class="exhead"><span>Exercise</span><span>Sets</span><span>Reps</span></div>`+
    list.map(a=>`<div class="exrow" data-ex="${a.n}">
      <div class="exleft"><button type="button" class="excheck ${a.done?'on':''}">✓</button>
        <div><div class="exn">${a.n}</div><div class="exp">${a.p}</div></div></div>
      ${stepper("sets",a.sets)}${stepper("reps",a.reps)}</div>`).join("");
  strRows.querySelectorAll(".excheck").forEach(b=>b.addEventListener("click",()=>b.classList.toggle("on")));
  strRows.querySelectorAll(".stepper button").forEach(b=>b.addEventListener("click",()=>{
    const span=b.parentElement.querySelector("span");
    let v=(+span.textContent)+(+b.getAttribute("data-s"));if(v<0)v=0;span.textContent=v;
  }));
  strSheet.classList.remove("hidden");
}
document.getElementById("strSave").addEventListener("click",()=>{
  const log=getLog(),k=key(strW,strD),e=log[k]||{},str={};
  strRows.querySelectorAll(".exrow").forEach(row=>{
    const n=row.getAttribute("data-ex"),def=(STRENGTH[strD]||[]).find(x=>x.n===n)||{};
    const done=row.querySelector(".excheck").classList.contains("on");
    const sets=+row.querySelector('.stepper[data-f="sets"] span').textContent;
    const reps=+row.querySelector('.stepper[data-f="reps"] span').textContent;
    if(done||sets!==def.sets||reps!==def.reps)str[n]={sets,reps,done};
  });
  if(Object.keys(str).length)e.str=str;else delete e.str;
  if(!e.done&&!e.dist&&!e.timeSec&&!e.note&&!e.str)delete log[k];else log[k]=e;
  setLog(log);strSheet.classList.add("hidden");render();
});
document.getElementById("strCancel").addEventListener("click",()=>strSheet.classList.add("hidden"));

/* ---------- settings ---------- */
const sheet=document.getElementById("sheet"),raceInput=document.getElementById("raceInput"),dateInfo=document.getElementById("dateInfo");
function updateInfo(){const v=raceInput.value;if(!v){dateInfo.textContent="";return;}
  const race=parseDate(v),start=startFromRace(race);
  dateInfo.innerHTML=`Plan runs <b>${fmtDate(start)}</b> → <b>${fmtDate(race)}</b>.`;}
raceInput.addEventListener("input",updateInfo);
document.getElementById("settingsBtn").addEventListener("click",()=>{
  raceInput.value=toISO(getRace());updateInfo();sheet.classList.remove("hidden");});
document.getElementById("closeBtn").addEventListener("click",()=>sheet.classList.add("hidden"));
document.getElementById("saveBtn").addEventListener("click",()=>{
  if(!raceInput.value)return;localStorage.setItem(LS_RACE,raceInput.value);sheet.classList.add("hidden");render();});
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Erase ALL logged runs and checkmarks? (Keeps race date.)")){
    localStorage.removeItem(LS_LOG);localStorage.removeItem(LS_SEED);sheet.classList.add("hidden");location.reload();}});

render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const n=dayNumber(startFromRace(getRace()),midnight(new Date()));if(n!==CUR_N)render();}});
</script>
</body>
</html>
